<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Us | Noretsoret CU E-Team</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    scroll-behavior: smooth;
}

header{
    background:#002147;
    color:white;
    padding:15px 0;
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:90%;
    margin:auto;
}

nav ul{
    list-style:none;
    display:flex;
    gap:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav ul li a:hover{
    color:gold;
}

.menu-btn{
    display:none;
    color:white;
    font-size:24px;
}

@media(max-width:768px){
    nav ul{
        flex-direction:column;
        background:#002147;
        display:none;
        position:absolute;
        right:20px;
        top:60px;
        padding:20px;
    }
    nav ul.show{
        display:block;
    }
    .menu-btn{
        display:block;
        cursor:pointer;
    }
}

section{
    padding:120px 20px;
    width:90%;
    margin:auto;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
    color:#002147;
}

form{
    max-width:500px;
    margin:auto;
}

form input, form textarea{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

form button{
    background:#002147;
    color:white;
    padding:10px;
    border:none;
    cursor:pointer;
}

form button:hover{
    background:gold;
    color:black;
}

footer{
    background:#002147;
    color:white;
    text-align:center;
    padding:20px;
}

html{
    scroll-padding-top:100px;
}
</style>
</head>

<body>

<header>
<nav>
    <img src="images/Screenshot 2026-02-20 120807.png" height="50" alt="Noretsoret Logo">
    <h2>Noretsoret CU E-Team</h2>
    <span class="menu-btn" onclick="toggleMenu()">☰</span>
    <ul id="menu">
        <li><a href="l.html">Home</a></li>
        <li><a href="join.html">Join Us</a></li>
    </ul>
</nav>
</header>

<section id="join">
    <h2 class="section-title">Join Us</h2>
    <form onsubmit="return submitForm()">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
        <textarea placeholder="Why would you like to join?"></textarea>
        <button type="submit">Submit</button>
    </form>
</section>

<footer>
    <p>© 2026 Noretsoret Christian Union E-Team | University of Nairobi</p>
</footer>

<script>
function toggleMenu(){
    document.getElementById("menu").classList.toggle("show");
}

function submitJoinForm(){
    const name = document.getElementById("fullName").value;
    document.getElementById("joinForm").style.display = "none";
    const message = `Welcome ${name}! Thank you for joining Noretsoret Family. 🙏`;
    const msgElem = document.getElementById("welcomeMessage");
    msgElem.textContent = message;
    msgElem.style.display = "block";
    return false;
}
</script>

</body>
</html>
